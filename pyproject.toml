[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enigma2-web"
version = "1.1.11"
description = "Zentrale Timer- und Aufnahmen-Verwaltung für Enigma2-Receiver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "jinja2>=3.1,<4", "pwdlib[argon2]>=0.3,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1", "cryptography>=44,<51",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
e2web = "e2web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/e2web"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE.md" = "e2web/NOTICE.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/deploy", "/scripts", "/.github", "/.gitattributes", "/.gitignore",
  "/README.md", "/INSTALL.md", "/CHANGELOG.md", "/RELEASE_NOTES.md",
  "/GITHUB.md", "/VERIFICATION.md", "/NOTICE.md", "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
