{% extends "base.html" %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">BENUTZERKONTO</p><h1>Passwort ändern</h1></div></div>
<section class="panel form-panel">
  {% if current_user.must_change_password %}<p class="panel-intro">Bitte vor der ersten Verwendung ein eigenes Passwort vergeben.</p>{% endif %}
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Aktuelles Passwort<input type="password" name="current_password" autocomplete="current-password" maxlength="128" required></label>
    <label>Neues Passwort<input type="password" name="password" autocomplete="new-password" maxlength="128" required></label>
    <label>Neues Passwort wiederholen<input type="password" name="password_confirmation" autocomplete="new-password" maxlength="128" required></label>
    <p class="form-hint">Nach dem Speichern werden alle bisherigen Sitzungen abgemeldet.</p>
    <div class="form-actions"><button class="button button-primary">Passwort speichern</button></div>
  </form>
</section>
{% endblock %}
